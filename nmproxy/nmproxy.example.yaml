# nmproxy configuration
#
# Copy this file, fill in the API key and the datasets you expect, and pass its path to
# -config:
#
#     nmproxy -config <path to nmproxy.yaml>
#
# The file holds an API key, so keep it out of version control and readable only by the
# account running nmproxy (chmod 600). On Linux and macOS, nmproxy warns at startup if
# other accounts can read the file.
#
# nmproxy refuses to start if this file has a key it does not recognize.


# UDP address to receive frames on.
#
# Bind to a specific interface where you can. Frames carry no authentication, so the
# listening interface is the primary access control — 0.0.0.0 accepts from anywhere that
# can route to this machine.
listen: "0.0.0.0:15400"


nominal:
  # The REST API base URL of your Nominal instance: the API URL on your organization's
  # API keys page.
  base_url: "<API URL>"

  # A Nominal API key.
  token: "<API key>"


# The RIDs of the datasets nmproxy may write to.
#
# Frames are not authenticated, so with this list empty anything that can reach the
# listening port can write to any dataset the API key can. Leave it empty only on an
# isolated network. nmproxy warns at startup when it is empty.
allowed_datasets:
  # - "<dataset RID>"


# How long nmproxy keeps a model's stream open after the model stops sending.
#
# Hosts repeat their channel list every second, so any value above a few seconds works.
idle_timeout: 5m


# How often to log a summary of rows received, gaps detected and frames rejected.
# Set to 0 to disable.
stats_interval: 30s


# One of debug, info, warn, error. In a dry run, debug logs every row, which is a lot at
# 1 kHz.
log_level: "info"


# Decode and log frames without writing anything to Nominal.
#
# Use it to check that frames arrive and decode to sensible values. A dry run needs no
# API key.
dry_run: false
