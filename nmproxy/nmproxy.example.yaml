# nmproxy configuration
#
# Copy this file, fill in the datasets you expect, and pass its path to -config:
#
#     nmproxy -config <path to nmproxy.yaml>
#
# The API key isn't in this file. nmproxy reads it, with your instance's API URL, from a
# profile in Nominal's config file, the same file the Simulink block and Nominal's other
# clients read. That file holds the key, so keep it readable only by the account running
# nmproxy (chmod 600). On Linux and macOS, nmproxy warns at startup if other accounts can
# read it.
#
# nmproxy refuses to start if this file has a key it does not recognize.


# UDP address to receive frames on.
#
# Bind to a specific interface where you can. Frames carry no authentication, so the
# listening interface is the primary access control — 0.0.0.0 accepts from anywhere that
# can route to this machine.
listen: "0.0.0.0:15400"


# The profile in Nominal's config file that holds the API key and base URL. Runs go in the
# profile's workspace_rid, or in your organization's default workspace when it has none.
profile: "default"

# Nominal's config file. Empty reads ~/.config/nominal/config.yml in the home folder of the
# account running nmproxy, or %USERPROFILE%\.config\nominal\config.yml on Windows.
profile_file: ""


# The RIDs of the datasets nmproxy may write to.
#
# Frames are not authenticated, so with this list empty anything that can reach the
# listening port can write to any dataset the API key can. Leave it empty only on an
# isolated network. nmproxy warns at startup when it is empty.
allowed_datasets:
  # - "<dataset RID>"


# How long nmproxy keeps a model's stream open after the model stops sending.
#
# Hosts repeat their channel list every second, so any value above a few seconds works.
idle_timeout: 5m


# How often to log a summary of rows received, gaps detected and frames rejected.
# Set to 0 to disable.
stats_interval: 30s


# One of debug, info, warn, error. In a dry run, debug logs every row, which is a lot at
# 1 kHz.
log_level: "info"


# Decode and log frames, and the runs nmproxy would make, without writing anything to
# Nominal.
#
# Use it to check that frames arrive and decode to sensible values. A dry run reads no
# profile, so it needs no API key.
dry_run: false
