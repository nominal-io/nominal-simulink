# Builds, tests and packages the Nominal Blockset and the nmproxy relay, and attaches
# both to a GitHub release when a v* tag is pushed.
#
# The shape follows the support range. The oldest supported release, R2021b, builds
# everything that ships: a library opens only in the release that saved it or a later
# one, and a MEX built against an older release loads in newer ones but not the reverse.
# The Mac MEX is the exception, built by R2023b, the first release that runs natively on
# Apple silicon. R2026a packages, since ToolboxOptions needs R2023a or later. The installed
# toolbox is then tested on the oldest and newest release on each platform, because that
# is what a user runs.

name: blockset

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# MATLAB on GitHub-hosted runners needs no licence for a public repository. A private one
# needs a MathWorks batch licensing token, stored as the MLM_LICENSE_TOKEN secret.
env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

jobs:
  mex-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        id: matlab
        with:
          release: R2021b
          products: Simulink

      # Building curl takes several minutes, and the triplet is pinned, so cache it.
      - uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-curl-x64-windows-static-md-v1

      # static-md, as in the justfile: no DLL beside the .mexw64, and the dynamic CRT
      # that MATLAB itself uses.
      - name: Install libcurl
        run: vcpkg install curl:x64-windows-static-md

      - name: Build the library and MEX, and run the C tests
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DMatlab_ROOT_DIR="${{ steps.matlab.outputs.matlabroot }}"
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: mex-win64
          path: simulink/blockset/mex/nominal_sink_sfun.mexw64
          if-no-files-found: error

  mex-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        id: matlab
        with:
          release: R2021b
          products: Simulink

      # Built in Rocky Linux 8 rather than on the runner. A binary needs the glibc it
      # was linked against or newer, so one built on the Ubuntu 22.04 runner would refuse
      # to load on RHEL 8, which R2021b supports. MATLAB is only read, for its headers and libraries.
      #
      # libcurl is linked dynamically. Inside MATLAB that resolves to the libcurl MATLAB
      # ships, which is built against its own renamed OpenSSL, so nothing clashes.
      - name: Build the library and MEX, and run the C tests (Rocky Linux 8)
        env:
          MATLAB_ROOT: ${{ steps.matlab.outputs.matlabroot }}
        run: |
          docker run --rm \
            -v "$MATLAB_ROOT:$MATLAB_ROOT:ro" -v "$PWD:/src" -w /src \
            rockylinux:8 bash -euo pipefail -c "
              dnf install -y -q gcc make cmake libcurl-devel
              cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DMatlab_ROOT_DIR='$MATLAB_ROOT'
              cmake --build build-linux -j
              ctest --test-dir build-linux --output-on-failure"

      - uses: actions/upload-artifact@v4
        with:
          name: mex-glnxa64
          path: simulink/blockset/mex/nominal_sink_sfun.mexa64
          if-no-files-found: error

  mex-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # This runner is Apple silicon, and R2023b is the first release that runs natively
      # on it.
      - uses: matlab-actions/setup-matlab@v2
        id: matlab
        with:
          release: R2023b
          products: Simulink

      # libcurl comes with macOS, so there is nothing to install.
      - name: Build the library and MEX, and run the C tests
        run: |
          cmake -S . -B build -DMatlab_ROOT_DIR="${{ steps.matlab.outputs.matlabroot }}"
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: mex-maca64
          path: simulink/blockset/mex/nominal_sink_sfun.mexmaca64
          if-no-files-found: error

  # Everything else that ships, generated by the oldest release, then the block tests.
  assemble:
    needs: [mex-windows, mex-linux, mex-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: mex-*
          path: simulink/blockset/mex
          merge-multiple: true

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2021b
          products: Simulink

      - name: Generate the library, example and docs
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('simulink/tools'); make_library; make_example; make_docs

      - name: Block tests
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            addpath('simulink/tests');
            assertSuccess(runtests({'SinkBlockTest', 'AutonamesTest', 'LibraryMetadataTest'}))

      - uses: actions/upload-artifact@v4
        with:
          name: blockset
          path: simulink/blockset
          if-no-files-found: error

  package:
    needs: assemble
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blockset
          path: simulink/blockset

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: Simulink

      # make_docs again: the search index format changed in R2022a, so this release
      # builds the index it reads, beside the one R2021b built.
      - name: Package
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('simulink/tools'); make_docs; package_blockset

      - uses: actions/upload-artifact@v4
        with:
          name: mltbx
          path: build/NominalBlockset-*.mltbx
          if-no-files-found: error

  install-test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
        release: [R2021b, R2026a]
        include:
          - os: macos-14
            release: R2023b
          - os: macos-14
            release: R2026a
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mltbx
          path: build

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}
          products: Simulink

      - name: Install the toolbox and test it
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('simulink/tests'); assertSuccess(runtests('InstalledToolboxTest'))

  # The relay, prebuilt for each platform it is likely to run on. Pure Go with cgo off,
  # so one runner cross-builds them all and the binaries need nothing installed.
  relay:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: nmproxy/go.mod
          cache-dependency-path: nmproxy/go.sum

      - name: Vet and test
        working-directory: nmproxy
        run: go vet ./... && go test ./...

      # Each archive holds the binary and nmproxy.example.yaml, the example configuration
      # to start from. A build that is not from a tag says so in its version, so a binary
      # from main is never mistaken for a release.
      - name: Build an archive per platform
        run: |
          version="$(tr -d '[:space:]' < simulink/VERSION)"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then version="$version-dev.${GITHUB_SHA::7}"; fi
          mkdir -p stage dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="nmproxy-$version-$os-$arch"
            exe=""; [ "$os" = "windows" ] && exe=".exe"
            mkdir -p "stage/$name"
            (cd nmproxy && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "../stage/$name/nmproxy$exe" ./cmd/nmproxy)
            cp nmproxy/nmproxy.example.yaml "stage/$name/"
            if [ "$os" = "windows" ]; then
              (cd stage && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C stage -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum nmproxy-* > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: relay
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [install-test, relay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mltbx
          path: build

      - uses: actions/download-artifact@v4
        with:
          name: relay
          path: build

      # The tag names the release and VERSION versions the toolbox, so a mismatch would
      # publish v0.2.0 containing 0.1.0.
      - name: Check the tag matches simulink/VERSION
        run: |
          want="v$(tr -d '[:space:]' < simulink/VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match simulink/VERSION ($want)"
            exit 1
          fi

      - name: Attach the toolbox and the relay to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/NominalBlockset-*.mltbx build/nmproxy-* build/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Nominal Blockset $GITHUB_REF_NAME" \
            --notes "Install the blockset by opening the .mltbx in MATLAB R2021b or later, or R2023b or later on a Mac. The nmproxy archives hold the relay for each platform, with an example configuration."
